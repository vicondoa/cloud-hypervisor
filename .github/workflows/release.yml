name: Release

on:
  push:
    tags: ["v*-nixling.*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      GITHUB_TOKEN: ""
      ACTIONS_RUNTIME_TOKEN: ""
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ runner.os }}"
          save-if: ${{ github.ref_type == 'tag' }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap-ng-dev libglib2.0-dev libfdt-dev
      - name: Fetch and patch vhost dependency
        run: |
          # CH workspace expects ../vhost/ with patched rust-vmm/vhost
          cd ..
          git clone --depth 1 --branch vhost-user-backend-v0.22.0 \
            https://github.com/rust-vmm/vhost.git vhost
          cd vhost
          git apply $GITHUB_WORKSPACE/patches/0001-vhost_user-add-get_size-to-MsgHeader.patch || true
          git apply $GITHUB_WORKSPACE/patches/0002-vhost-fix-receiving-reply-payloads.patch || true
          git apply $GITHUB_WORKSPACE/patches/0003-shared-memory-region-compat.patch || true
      - name: Build cloud-hypervisor (release)
        run: cargo build --release --bin cloud-hypervisor --bin ch-remote
      - name: Package binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p release
          tar czf "release/cloud-hypervisor-${VERSION}-x86_64-linux.tar.gz" \
            -C target/release cloud-hypervisor ch-remote
          cd release && sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: release/

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: release/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          gh release create "$VERSION" release/* \
            --title "$VERSION" \
            --notes "Automated release. cloud-hypervisor with nixling virtio-gpu patches."

      - name: Install Nix (for hash computation)
        uses: DeterminateSystems/nix-installer-action@main
      - name: Compute SRI hashes and commit prebuilt manifest
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          REPO="${{ github.repository }}"

          mkdir -p nix
          {
            echo "{"
            echo "  \"version\": \"$VERSION\","
            echo "  \"system\": \"x86_64-linux\","
            echo "  \"binaries\": {"
            first=true
            for asset in release/*.tar.gz; do
              [ -f "$asset" ] || continue
              base=$(basename "$asset")
              name=$(echo "$base" | sed -E "s/-${VERSION}-x86_64-linux\.tar\.gz$//")
              sri=$(nix hash file --type sha256 --sri "$asset")
              url="https://github.com/${REPO}/releases/download/${VERSION}/${base}"
              if [ "$first" = true ]; then first=false; else printf ',\n'; fi
              printf '    "%s": {\n      "url": "%s",\n      "hash": "%s"\n    }' "$name" "$url" "$sri"
            done
            echo ""
            echo "  }"
            echo "}"
          } > nix/prebuilt.json

      - name: Commit prebuilt manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/prebuilt.json
          git diff --cached --quiet && exit 0
          git commit -m "release: update prebuilt manifest for ${GITHUB_REF_NAME}"
          git push origin HEAD
